<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{margin:0;padding:0;background:#FFFFFF}
  .fig{width:1200px;height:900px;background:#FFFFFF;font-family:'Helvetica Neue',Arial,'PingFang SC',sans-serif}
</style>
</head>
<body>
<div class="fig">
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">

<rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>

<!-- Subtle ring: echoes the Ring 0/Ring 3 architecture metaphor -->
<circle cx="600" cy="420" r="280" fill="none" stroke="#E8EFFD" stroke-width="0.5"/>
<circle cx="600" cy="420" r="310" fill="none" stroke="#E8EFFD" stroke-width="0.3" stroke-dasharray="2,4"/>

<!-- SLOGAN — dominant element -->
<!-- "NO Rent," in dark gray -->
<text x="600" y="420" text-anchor="middle" font-size="84" font-weight="700" fill="#475569" letter-spacing="2">
  NO Rent,<tspan fill="#3866FA"> Root YES!</tspan>
</text>

<!-- Chinese resonance -->
<text x="600" y="490" text-anchor="middle" font-size="24" font-weight="600" fill="#475569" letter-spacing="4">
  不租智能。<tspan fill="#3866FA">掌控智能。</tspan>
</text>

<!-- Code-verified proof — the bridge from slogan to substance -->
<text x="600" y="530" text-anchor="middle" font-size="13" fill="#94A3B8" letter-spacing="1">
  5 providers. 5 routes. 1 control plane. Yours.
</text>

<!-- Thin divider -->
<line x1="480" y1="590" x2="720" y2="590" stroke="#E2E8F0" stroke-width="0.5"/>

<!-- Company info -->
<text x="600" y="660" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Airymax</text>
<text x="600" y="684" text-anchor="middle" font-size="11" fill="#94A3B8">SPHARX Ltd.</text>
<text x="600" y="706" text-anchor="middle" font-size="10" fill="#94A3B8">airymax.io  ·  openairymax@atomgit.com</text>

</svg>
</div>
</body>
</html>
