<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.fig{width:750px;height:1000px;background:#fff;position:relative;font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}</style>
</head>
<body><div class="fig">
<svg width="750" height="1000" viewBox="0 0 750 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0000000e"/></filter>
<filter id="shL"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000008"/></filter>
<marker id="arA" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#6366F1"/></marker>
<marker id="arB" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#10B981"/></marker>
<marker id="arC" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#F97316"/></marker>
<marker id="arD" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#8B5CF6"/></marker>
<linearGradient id="gAG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient>
<linearGradient id="gAG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="gAG3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F97316"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
<linearGradient id="gAG4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
<linearGradient id="gBUS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E293B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
</defs>

<!-- Title -->
<rect x="0" y="0" width="750" height="50" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="375" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E293B" letter-spacing="1.5">Agents IPC: Multi-Agent Inter-Process Communication System</text>
<text x="375" y="40" text-anchor="middle" font-size="8" fill="#9CA3AF">Zero-Copy Shared Memory · Semaphore-Based Synchronization · Agent Registry &amp; Discovery · &lt;10μs Latency</text>

<!-- ===== Agent 1: Cognition (Top-Left) ===== -->
<rect x="20" y="70" width="210" height="126" rx="6" fill="#fff" stroke="#6366F1" stroke-width="1.5" filter="url(#shL)"/>
<rect x="20" y="70" width="210" height="28" rx="6" fill="url(#gAG1)"/>
<rect x="20" y="88" width="210" height="10" fill="url(#gAG1)"/>
<text x="125" y="90" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Cognition Agent</text>
<text x="34" y="116" font-size="6.5" fill="#374151">Role: Intent Parse → Plan(DAG)</text>
<text x="34" y="132" font-size="6.5" fill="#374151">Produces: TaskGraph</text>
<text x="34" y="148" font-size="6.5" fill="#374151">Consumes: MemoryContext, UserInput</text>
<text x="34" y="164" font-size="6.5" fill="#374151">IPC Channel: shm://coreloop/cognition</text>
<rect x="200" y="180" width="16" height="16" rx="2" fill="#6366F1"/><text x="208" y="192" text-anchor="middle" font-size="7" fill="#fff">1</text>

<!-- ===== Agent 2: Execution (Top-Right) ===== -->
<rect x="520" y="70" width="210" height="126" rx="6" fill="#fff" stroke="#10B981" stroke-width="1.5" filter="url(#shL)"/>
<rect x="520" y="70" width="210" height="28" rx="6" fill="url(#gAG2)"/>
<rect x="520" y="88" width="210" height="10" fill="url(#gAG2)"/>
<text x="625" y="90" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Execution Agent</text>
<text x="534" y="116" font-size="6.5" fill="#374151">Role: Task Execution Dispatch</text>
<text x="534" y="132" font-size="6.5" fill="#374151">Produces: ActionResult</text>
<text x="534" y="148" font-size="6.5" fill="#374151">Consumes: TaskGraph, Tools</text>
<text x="534" y="164" font-size="6.5" fill="#374151">IPC Channel: shm://coreloop/exec</text>
<rect x="534" y="180" width="16" height="16" rx="2" fill="#10B981"/><text x="542" y="192" text-anchor="middle" font-size="7" fill="#fff">2</text>

<!-- ===== IPC BUS (Center) ===== -->
<rect x="240" y="280" width="270" height="300" rx="10" fill="url(#gBUS)" filter="url(#sh)"/>
<text x="375" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">IPC Binder Bus</text>
<text x="375" y="328" text-anchor="middle" font-size="7" fill="#64748B">Zero-Copy · Lock-Free · Deterministic</text>

<!-- Shared Memory Pool -->
<rect x="258" y="344" width="234" height="52" rx="4" fill="#ffffff0f" stroke="#ffffff18" stroke-width="0.8"/>
<text x="270" y="362" font-size="7" font-weight="600" fill="#CBD5E1">Shared Memory Pool</text>
<text x="270" y="378" font-size="6" fill="#94A3B8">128 MB · mmap(MAP_SHARED|MAP_ANONYMOUS)</text>
<text x="270" y="392" font-size="6" fill="#94A3B8">Message max_size: 64KB · Ring buffer layout</text>

<!-- Semaphore -->
<rect x="258" y="404" width="112" height="40" rx="4" fill="#ffffff0f" stroke="#ffffff18" stroke-width="0.8"/>
<text x="270" y="420" font-size="7" font-weight="600" fill="#CBD5E1">Semaphore</text>
<text x="270" y="436" font-size="6" fill="#94A3B8">sem_wait / sem_post</text>

<!-- Registry -->
<rect x="380" y="404" width="112" height="40" rx="4" fill="#ffffff0f" stroke="#ffffff18" stroke-width="0.8"/>
<text x="392" y="420" font-size="7" font-weight="600" fill="#CBD5E1">Agent Registry</text>
<text x="392" y="436" font-size="6" fill="#94A3B8">name→pid→channel map</text>

<!-- Message Queue -->
<rect x="258" y="452" width="234" height="52" rx="4" fill="#ffffff0f" stroke="#ffffff18" stroke-width="0.8"/>
<text x="270" y="470" font-size="7" font-weight="600" fill="#CBD5E1">Lock-Free Message Queues</text>
<text x="270" y="486" font-size="6" fill="#94A3B8">Per-agent SPSC ring buffer · CAS-based enqueue/dequeue</text>
<text x="270" y="500" font-size="6" fill="#94A3B8">Priority: 0-100 · Timeout: 5000ms default</text>

<!-- Bus features -->
<rect x="258" y="512" width="234" height="56" rx="4" fill="#ffffff0f" stroke="#ffffff18" stroke-width="0.8"/>
<text x="270" y="528" font-size="7" font-weight="600" fill="#CBD5E1">Communication Patterns</text>
<rect x="270" y="536" width="68" height="13" rx="2" fill="#ffffff15"/><text x="304" y="546" text-anchor="middle" font-size="5.5" fill="#CBD5E1">P2P Unicast</text>
<rect x="344" y="536" width="68" height="13" rx="2" fill="#ffffff15"/><text x="378" y="546" text-anchor="middle" font-size="5.5" fill="#CBD5E1">Broadcast</text>
<rect x="418" y="536" width="62" height="13" rx="2" fill="#ffffff15"/><text x="449" y="546" text-anchor="middle" font-size="5.5" fill="#CBD5E1">Pub/Sub</text>
<text x="270" y="562" font-size="6" fill="#94A3B8">Throughput: 100K+ msg/s · P99 latency: &lt;10 μs · Zero deadlock</text>

<!-- ===== Agent 3: Memory (Bottom-Left) ===== -->
<rect x="20" y="620" width="210" height="126" rx="6" fill="#fff" stroke="#F97316" stroke-width="1.5" filter="url(#shL)"/>
<rect x="20" y="620" width="210" height="28" rx="6" fill="url(#gAG3)"/>
<rect x="20" y="638" width="210" height="10" fill="url(#gAG3)"/>
<text x="125" y="640" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Memory Agent</text>
<text x="34" y="666" font-size="6.5" fill="#374151">Role: Memory Read/Write/Evolution</text>
<text x="34" y="682" font-size="6.5" fill="#374151">Produces: MemoryContext, Patterns</text>
<text x="34" y="698" font-size="6.5" fill="#374151">Consumes: ActionResult, UserData</text>
<text x="34" y="714" font-size="6.5" fill="#374151">IPC Channel: shm://memoryrovol/data</text>
<rect x="200" y="602" width="16" height="16" rx="2" fill="#F97316"/><text x="208" y="614" text-anchor="middle" font-size="7" fill="#fff">3</text>

<!-- ===== Agent 4: Security (Bottom-Right) ===== -->
<rect x="520" y="620" width="210" height="126" rx="6" fill="#fff" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shL)"/>
<rect x="520" y="620" width="210" height="28" rx="6" fill="url(#gAG4)"/>
<rect x="520" y="638" width="210" height="10" fill="url(#gAG4)"/>
<text x="625" y="640" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Security Agent (Cupolas)</text>
<text x="534" y="666" font-size="6.5" fill="#374151">Role: Permission · Audit · Sanitize</text>
<text x="534" y="682" font-size="6.5" fill="#374151">Produces: Verdict, AuditLog</text>
<text x="534" y="698" font-size="6.5" fill="#374151">Consumes: Every inter-agent msg</text>
<text x="534" y="714" font-size="6.5" fill="#374151">IPC Channel: shm://cupolas/audit</text>
<rect x="534" y="602" width="16" height="16" rx="2" fill="#8B5CF6"/><text x="542" y="614" text-anchor="middle" font-size="7" fill="#fff">4</text>

<!-- Connections to bus -->
<line x1="230" y1="133" x2="252" y2="400" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.5"/>
<line x1="520" y1="133" x2="498" y2="400" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.5"/>
<line x1="230" y1="683" x2="252" y2="460" stroke="#F97316" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.5"/>
<line x1="520" y1="683" x2="498" y2="460" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.5"/>

<!-- Message example arrows -->
<path d="M230,113 L265,360 L280,370" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.3"/>
<path d="M510,113 L485,360 L470,370" stroke="#10B981" stroke-width="1" fill="none" opacity="0.3"/>

<!-- ===== BOTTOM LEFT: Message Protocol ===== -->
<rect x="16" y="760" width="350" height="220" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.8"/>
<text x="30" y="782" font-size="8" font-weight="700" fill="#1E293B" letter-spacing="0.5">MESSAGE PROTOCOL &amp; FORMAT</text>

<rect x="30" y="796" width="320" height="52" rx="3" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="42" y="812" font-size="7" font-weight="600" fill="#374151">Message Header (32 bytes fixed)</text>
<text x="42" y="826" font-size="6" fill="#6B7280" font-family="'Courier New',monospace">msg_id:u64 | src_agent:u32 | dst_agent:u32 | type:u8 | prio:u8</text>
<text x="42" y="840" font-size="6" fill="#6B7280" font-family="'Courier New',monospace">payload_len:u32 | flags:u8 | checksum:u16 | timestamp:u64</text>

<rect x="30" y="856" width="320" height="28" rx="3" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="42" y="868" font-size="7" font-weight="600" fill="#374151">Message Types</text>
<rect x="140" y="856" width="56" height="13" rx="2" fill="#DBEAFE"/><text x="168" y="866" text-anchor="middle" font-size="5.5" fill="#1E40AF">MSG_TASK</text>
<rect x="200" y="856" width="56" height="13" rx="2" fill="#D1FAE5"/><text x="228" y="866" text-anchor="middle" font-size="5.5" fill="#047857">MSG_RESULT</text>
<rect x="260" y="856" width="80" height="13" rx="2" fill="#FEF3C7"/><text x="300" y="866" text-anchor="middle" font-size="5.5" fill="#B45309">MSG_MEMORY_CTX</text>

<text x="30" y="904" font-size="7" font-weight="700" fill="#374151">Synchronization Guarantees:</text>
<text x="30" y="920" font-size="6.5" fill="#6B7280">• happens-before: sem_post(m) in sender precedes sem_wait(m) in receiver</text>
<text x="30" y="936" font-size="6.5" fill="#6B7280">• Causal ordering: per-agent FIFO message delivery</text>
<text x="30" y="952" font-size="6.5" fill="#6B7280">• Deadlock freedom: strict resource ordering hierarchy</text>
<text x="30" y="972" font-size="6" fill="#9CA3AF">Formally: No circular wait → Banker's algorithm variant for message channels</text>

<!-- ===== BOTTOM RIGHT: Topology & Discovery ===== -->
<rect x="378" y="760" width="356" height="220" rx="6" fill="#fff" stroke="#E5E7EB" stroke-width="0.8"/>
<text x="392" y="782" font-size="8" font-weight="700" fill="#1E293B" letter-spacing="0.5">AGENT DISCOVERY &amp; LIFECYCLE</text>

<text x="392" y="804" font-size="7" font-weight="600" fill="#374151">Agent Registration Flow</text>
<rect x="392" y="812" width="330" height="16" rx="2" fill="#EEF2FF"/><text x="400" y="824" font-size="6" fill="#4F46E5">agent_init() → registry_register(name, channel) → ready_signal → loop</text>

<text x="392" y="846" font-size="7" font-weight="600" fill="#374151">4 Multi-Agent Collaboration Patterns</text>
<rect x="392" y="856" width="330" height="18" rx="2" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/><text x="400" y="870" font-size="6.5" fill="#374151">Orchestrator</text><text x="540" y="870" font-size="6" fill="#6B7280">orchestrator → plan → delegate → aggregate</text>
<rect x="392" y="878" width="330" height="18" rx="2" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/><text x="400" y="892" font-size="6.5" fill="#374151">Debate</text><text x="540" y="892" font-size="6" fill="#6B7280">propose → debate → vote → consensus</text>
<rect x="392" y="900" width="330" height="18" rx="2" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/><text x="400" y="914" font-size="6.5" fill="#374151">Hierarchy</text><text x="540" y="914" font-size="6" fill="#6B7280">root → decompose → managers → workers</text>
<rect x="392" y="922" width="330" height="18" rx="2" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/><text x="400" y="936" font-size="6.5" fill="#374151">Market</text><text x="540" y="936" font-size="6" fill="#6B7280">announce → bid → award → execute → verify</text>

<text x="392" y="966" font-size="6.5" fill="#9CA3AF">All patterns are built on the IPC Binder primitives — no separate orchestration layer needed</text>

</svg>
</div></body></html>
