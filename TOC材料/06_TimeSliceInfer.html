<!-- Static scheduling -->

<text x="172" y="471" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Static Scheduler · 静态调度</text>

<text x="55" y="495" font-size="9" fill="#1a4a3a" font-weight="600">Fixed slice budget</text>
<text x="55" y="508" font-size="8" fill="#777" font-family="monospace">slice = 10 ms (const)</text>
<text x="55" y="522" font-size="8" fill="#777" font-family="monospace">quota = N × slice</text>

<text x="55" y="544" font-size="9" fill="#1a4a3a" font-weight="600">Use case</text>
<text x="55" y="557" font-size="8" fill="#777">deterministic latency</text>
<text x="55" y="569" font-size="8" fill="#777">batch / offline inference</text>

<text x="55" y="591" font-size="9" fill="#1a4a3a" font-weight="600">Pros / Cons</text>
<text x="55" y="604" font-size="8" fill="#2EC4B6">+ predictable · simple</text>
<text x="55" y="616" font-size="8" fill="#C04040">− no preemption · rigid</text>
<text x="55" y="628" font-size="8" fill="#777" font-style="italic">O(1) decision per slice</text>

<!-- Adaptive scheduling -->
<rect x="315" y="455" width="265" height="180" rx="10" fill="#fff" stroke="#E8734A" stroke-width="1.5" filter="url(#sh)"/>
<rect x="315" y="455" width="265" height="22" rx="10" fill="url(#gT3)"/>
<rect x="315" y="467" width="265" height="10" fill="url(#gT3)"/>
<text x="447" y="471" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Adaptive Scheduler · 自适应调度</text>

<text x="330" y="495" font-size="9" fill="#1a4a3a" font-weight="600">Dynamic slice budget</text>
<text x="330" y="508" font-size="8" fill="#777" font-family="monospace">slice = f(load, priority)</text>
<text x="330" y="522" font-size="8" fill="#777" font-family="monospace">slice ∈ [5ms, 50ms]</text>

<text x="330" y="544" font-size="9" fill="#1a4a3a" font-weight="600">Use case</text>
<text x="330" y="557" font-size="8" fill="#777">real-time · multi-tenant</text>
<text x="330" y="569" font-size="8" fill="#777">interactive agents</text>

<text x="330" y="591" font-size="9" fill="#1a4a3a" font-weight="600">Pros / Cons</text>
<text x="330" y="604" font-size="8" fill="#2EC4B6">+ responsive · fair QoS</text>
<text x="330" y="616" font-size="8" fill="#C04040">− overhead · complexity</text>
<text x="330" y="628" font-size="8" fill="#777" font-style="italic">O(log n) priority queue</text>
