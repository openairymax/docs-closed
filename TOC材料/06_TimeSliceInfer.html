<!-- Traditional approach -->
<rect x="20" y="110" width="345" height="160" rx="10" fill="#fff" stroke="#E8734A" stroke-width="1.5" filter="url(#sh)"/>
<rect x="20" y="110" width="345" height="28" rx="10" fill="#E8734A"/>

<text x="192" y="130" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">传统推理 Traditional Inference</text>

<text x="30" y="156" font-size="9" fill="#555">长任务 → 单次生成 · 一次性输出</text>
<text x="30" y="172" font-size="8" fill="#888">问题①: 超长任务 → 上下文溢出 (ctx &gt; 200K)</text>
<text x="30" y="186" font-size="8" fill="#888">问题②: 中途出错 → 全量重算 (代价大)</text>
<text x="30" y="200" font-size="8" fill="#888">问题③: 无中断恢复 · 状态丢失</text>
<text x="30" y="214" font-size="8" fill="#888">问题④: 无并行 · 串行阻塞</text>

<rect x="30" y="225" width="325" height="38" rx="6" fill="#FFF0EC"/>
<text x="40" y="240" font-size="8" font-weight="700" fill="#D45A30">局限: O(n) 复杂度 · n=任务长度</text>
<text x="40" y="255" font-size="7" fill="#999">不可中断 · 不可回溯 · 不可并行</text>

<rect x="385" y="130" width="345" height="8" fill="#4F7DF3"/>

<text x="395" y="172" font-size="8" fill="#888">优势①: 时间片 = 10ms · 上下文可控</text>
<text x="395" y="186" font-size="8" fill="#888">优势②: 单片出错 → 局部回溯 (省80%)</text>
<text x="395" y="200" font-size="8" fill="#888">优势③: 状态向量State_i 可序列化</text>
<text x="395" y="214" font-size="8" fill="#888">优势④: 独立时间片可并行</text>

<text x="405" y="255" font-size="7" fill="#999">可中断 · 可回溯 · 可并行 · 可恢复</text>

<!-- ===== SECTION C: Scheduling (560-780) ===== -->
<text x="30" y="578" font-size="13" font-weight="700" fill="#0D3A5C">C · 调度算法 Scheduling Algorithms</text>
<line x1="30" y1="584" x2="720" y2="584" stroke="#D0DCE8" stroke-width="1"/>

<!-- Static scheduling -->
<rect x="20" y="595" width="345" height="170" rx="10" fill="#fff" stroke="#4F7DF3" stroke-width="1.5" filter="url(#sh)"/>
<text x="30" y="615" font-size="11" font-weight="700" fill="#3A5FD9">静态调度 Static Scheduling</text>
<text x="280" y="615" font-size="9" font-weight="700" fill="#888">O(n/k)</text>

<text x="30" y="635" font-size="8" fill="#555">时间片长度: 固定 time_slice = 10ms</text>
<text x="30" y="649" font-size="8" fill="#555">并行度: k = min(CPU核, LLM并发)</text>
<text x="30" y="663" font-size="8" fill="#555">分配: round-robin 到 worker pool</text>

<text x="30" y="685" font-size="8" font-weight="700" fill="#4F7DF3">伪代码 Pseudocode</text>
<rect x="30" y="692" width="325" height="65" rx="4" fill="#EEF2FF"/>
<text x="40" y="708" font-size="7" font-family="monospace" fill="#3A5FD9">slices = chunk(task, time_slice)</text>
<text x="40" y="721" font-size="7" font-family="monospace" fill="#3A5FD9">for i, s in parallel(slices, k):</text>
<text x="40" y="734" font-size="7" font-family="monospace" fill="#3A5FD9">  state_i = infer(s, state_{i-1})</text>
<text x="40" y="747" font-size="7" font-family="monospace" fill="#3A5FD9">  if error: backtrack(i-1)</text>

<!-- Adaptive scheduling -->
<rect x="385" y="595" width="345" height="170" rx="10" fill="#fff" stroke="#7B5EE6" stroke-width="1.5" filter="url(#sh)"/>
<text x="395" y="615" font-size="11" font-weight="700" fill="#6540D0">自适应调度 Adaptive Scheduling</text>
<text x="640" y="615" font-size="9" font-weight="700" fill="#888">EWMA-based</text>

<text x="395" y="635" font-size="8" fill="#555">时间片长度: 动态调整 (conf反馈)</text>
<text x="395" y="649" font-size="8" fill="#555">置信度高 → 增大 slice (减少开销)</text>
<text x="395" y="663" font-size="8" fill="#555">置信度低 → 减小 slice (增精度)</text>

<text x="395" y="685" font-size="8" font-weight="700" fill="#7B5EE6">伪代码 Pseudocode</text>
<rect x="395" y="692" width="325" height="65" rx="4" fill="#F5F0FF"/>
<text x="405" y="708" font-size="7" font-family="monospace" fill="#6540D0">slice = init_slice</text>
<text x="405" y="721" font-size="7" font-family="monospace" fill="#6540D0">while not done:</text>
<text x="405" y="734" font-size="7" font-family="monospace" fill="#6540D0">  out, conf = infer(slice, state)</text>
<text x="405" y="747" font-size="7" font-family="monospace" fill="#6540D0">  slice = adjust(conf, EWMA_lat)</text>
