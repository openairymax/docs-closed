<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .figure {
    width: 750px;
    height: 1000px;
    background: #ffffff;
    position: relative;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="figure">
<svg width="750" height="1000" viewBox="0 0 750 1000" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000015"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0000000C"/>
    </filter>
    <linearGradient id="gradSlice1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#3B7BC5"/>
    </linearGradient>
    <linearGradient id="gradSlice2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#4A5FC5"/>
    </linearGradient>
    <linearGradient id="gradSlice3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#5A4FCC"/>
    </linearGradient>
    <linearGradient id="gradSliceN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AF7AC5"/>
      <stop offset="100%" stop-color="#8E5EA5"/>
    </linearGradient>
    <linearGradient id="gradState" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C69"/>
      <stop offset="100%" stop-color="#E87050"/>
    </linearGradient>
    <linearGradient id="gradResult" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48C9B0"/>
      <stop offset="100%" stop-color="#28A090"/>
    </linearGradient>
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="12" refY="3" orient="auto">
      <path d="M0,0 L12,3 L0,6 Z" fill="#667EEA"/>
    </marker>
    <marker id="arrowState" markerWidth="10" markerHeight="6" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#FF8C69"/>
    </marker>
    <marker id="arrowResult" markerWidth="10" markerHeight="6" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#48C9B0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#2C2C2C" letter-spacing="1">TimeSliceInfer — 分时推理框架</text>
  <line x1="225" y1="66" x2="525" y2="66" stroke="#667EEA" stroke-width="2" stroke-linecap="round"/>

  <!-- Problem statement -->
  <rect x="75" y="95" width="600" height="80" rx="12" fill="#FFF5F2" stroke="#FFCCBB" stroke-width="1"/>
  <text x="100" y="122" font-size="13" font-weight="700" fill="#D06040">问题</text>
  <text x="100" y="145" font-size="12" fill="#777">单次"全量加载→推理"原子操作受限于LLM上下文窗口(128K/200K)</text>
  <text x="100" y="163" font-size="12" fill="#777">当记忆积累超过窗口容量时 → 旧记忆截断丢失，检索结果不完整</text>

  <!-- TimeSlice Pipeline - horizontal -->
  <!-- T1 -->
  <rect x="30" y="210" width="145" height="220" rx="12" fill="#ffffff" stroke="#5B9BD5" stroke-width="2.5" filter="url(#shadowLight)"/>
  <rect x="30" y="210" width="145" height="40" rx="12" fill="url(#gradSlice1)"/>
  <rect x="30" y="238" width="145" height="12" fill="url(#gradSlice1)"/>
  <text x="102" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">时间片 T₁</text>

  <rect x="42" y="262" width="121" height="32" rx="6" fill="#EDF4FD"/>
  <text x="102" y="283" text-anchor="middle" font-size="10" fill="#555">记忆集₁ 加载</text>

  <rect x="42" y="302" width="121" height="36" rx="6" fill="#EFF3FF"/>
  <text x="102" y="319" text-anchor="middle" font-size="10" fill="#555">LLM 推理</text>
  <text x="102" y="332" text-anchor="middle" font-size="8" fill="#888">Token Budget₁</text>

  <rect x="42" y="346" width="121" height="36" rx="6" fill="#F2F0FF"/>
  <text x="102" y="363" text-anchor="middle" font-size="10" fill="#555">结论₁ + 置信度₁</text>
  <text x="102" y="376" text-anchor="middle" font-size="8" fill="#888">Embedding生成</text>

  <!-- Arrow T1 -> T2 (main) -->
  <line x1="180" y1="320" x2="215" y2="320" stroke="#5B9BD5" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- State arrow T1 -> T2 (below) -->
  <path d="M100,390 L100,410 L270,410 L270,320" stroke="#FF8C69" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowState)"/>
  <rect x="115" y="400" width="140" height="20" rx="4" fill="#FFF0EC"/>
  <text x="185" y="414" text-anchor="middle" font-size="9" fill="#E87050">状态向量 State₁⁻⟩</text>

  <!-- T2 -->
  <rect x="220" y="210" width="145" height="220" rx="12" fill="#ffffff" stroke="#667EEA" stroke-width="2.5" filter="url(#shadowLight)"/>
  <rect x="220" y="210" width="145" height="40" rx="12" fill="url(#gradSlice2)"/>
  <rect x="220" y="238" width="145" height="12" fill="url(#gradSlice2)"/>
  <text x="292" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">时间片 T₂</text>

  <rect x="232" y="262" width="121" height="32" rx="6" fill="#EDF4FD"/>
  <text x="292" y="283" text-anchor="middle" font-size="10" fill="#555">记忆集₂ 加载</text>

  <rect x="232" y="302" width="121" height="36" rx="6" fill="#EFF3FF"/>
  <text x="292" y="319" text-anchor="middle" font-size="10" fill="#555">LLM 推理</text>
  <text x="292" y="332" text-anchor="middle" font-size="8" fill="#888">Token Budget₂</text>

  <rect x="232" y="346" width="121" height="36" rx="6" fill="#F2F0FF"/>
  <text x="292" y="363" text-anchor="middle" font-size="10" fill="#555">结论₂ + 置信度₂</text>
  <text x="292" y="376" text-anchor="middle" font-size="8" fill="#888">Embedding生成</text>

  <!-- Arrow T2 -> T3 -->
  <line x1="370" y1="320" x2="405" y2="320" stroke="#667EEA" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- State arrow T2 -> T3 -->
  <path d="M290,390 L290,425 L460,425 L460,320" stroke="#FF8C69" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowState)"/>
  <rect x="305" y="415" width="140" height="20" rx="4" fill="#FFF0EC"/>
  <text x="375" y="429" text-anchor="middle" font-size="9" fill="#E87050">状态向量 State₂⁻⟩</text>

  <!-- T3 -->
  <rect x="410" y="210" width="145" height="220" rx="12" fill="#ffffff" stroke="#7B68EE" stroke-width="2.5" filter="url(#shadowLight)"/>
  <rect x="410" y="210" width="145" height="40" rx="12" fill="url(#gradSlice3)"/>
  <rect x="410" y="238" width="145" height="12" fill="url(#gradSlice3)"/>
  <text x="482" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">时间片 T₃</text>

  <rect x="422" y="262" width="121" height="32" rx="6" fill="#EDF4FD"/>
  <text x="482" y="283" text-anchor="middle" font-size="10" fill="#555">记忆集₃ 加载</text>

  <rect x="422" y="302" width="121" height="36" rx="6" fill="#EFF3FF"/>
  <text x="482" y="319" text-anchor="middle" font-size="10" fill="#555">LLM 推理</text>
  <text x="482" y="332" text-anchor="middle" font-size="8" fill="#888">Token Budget₃</text>

  <rect x="422" y="346" width="121" height="36" rx="6" fill="#F2F0FF"/>
  <text x="482" y="363" text-anchor="middle" font-size="10" fill="#555">结论₃ + 置信度₃</text>
  <text x="482" y="376" text-anchor="middle" font-size="8" fill="#888">Embedding生成</text>

  <!-- Arrow T3 -> Tn -->
  <line x1="560" y1="320" x2="595" y2="320" stroke="#7B68EE" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Tn -->
  <rect x="600" y="210" width="120" height="220" rx="12" fill="#ffffff" stroke="#AF7AC5" stroke-width="2.5" filter="url(#shadowLight)"/>
  <rect x="600" y="210" width="120" height="40" rx="12" fill="url(#gradSliceN)"/>
  <rect x="600" y="238" width="120" height="12" fill="url(#gradSliceN)"/>
  <text x="660" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Tₙ ...</text>

  <rect x="612" y="268" width="96" height="28" rx="6" fill="#EDF4FD"/>
  <text x="660" y="287" text-anchor="middle" font-size="10" fill="#555">记忆集ₙ</text>

  <rect x="612" y="304" width="96" height="28" rx="6" fill="#EFF3FF"/>
  <text x="660" y="323" text-anchor="middle" font-size="10" fill="#555">推理ₙ</text>

  <rect x="612" y="340" width="96" height="28" rx="6" fill="#F2F0FF"/>
  <text x="660" y="359" text-anchor="middle" font-size="10" fill="#555">结论ₙ</text>

  <!-- State arrows continuing to Tn -->
  <path d="M480,390 L480,438 L650,438 L650,390" stroke="#FF8C69" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowState)"/>
  <rect x="495" y="428" width="140" height="20" rx="4" fill="#FFF0EC"/>
  <text x="565" y="442" text-anchor="middle" font-size="9" fill="#E87050">State₃⁻⟩ → ...</text>

  <!-- State vector legend -->
  <rect x="75" y="468" width="600" height="65" rx="10" fill="#FFF5F0" stroke="#FFDDCC" stroke-width="1"/>
  <text x="100" y="492" font-size="12" font-weight="700" fill="#E87050">推理状态向量 Stateᵢ：</text>
  <text x="100" y="510" font-size="11" fill="#777">Embedding(结论ᵢ ⊕ 关键发现ᵢ) : 固定768维向量</text>
  <text x="100" y="525" font-size="11" fill="#777">processed_count · confidence · intermediate_conclusion · 回溯栈</text>

  <!-- Bottom section: algorithms -->
  <rect x="75" y="565" width="600" height="155" rx="12" fill="#F8F9FC" stroke="#E8E8EE" stroke-width="1"/>
  <text x="100" y="595" font-size="14" font-weight="700" fill="#333">分片调度算法</text>

  <!-- Static scheduling -->
  <rect x="95" y="615" width="270" height="46" rx="8" fill="#EDF4FD"/>
  <text x="110" y="634" font-size="12" font-weight="700" fill="#5B9BD5">静态等分 (v0.1)</text>
  <text x="110" y="652" font-size="10" fill="#888">固定 Token Budget / 时间片</text>

  <rect x="385" y="615" width="270" height="46" rx="8" fill="#F2F0FF"/>
  <text x="400" y="634" font-size="12" font-weight="700" fill="#7B68EE">自适应分片 (v0.2)</text>
  <text x="400" y="652" font-size="10" fill="#888">根据置信度Δ动态调整预算</text>

  <!-- Termination conditions -->
  <rect x="95" y="670" width="270" height="38" rx="6" fill="#FFF0EC"/>
  <text x="110" y="690" font-size="10" font-weight="600" fill="#E87050">终止条件：</text>
  <text x="110" y="703" font-size="9" fill="#888">置信度≥0.95 | 预算耗尽 | 队列空 | 超时</text>

  <rect x="385" y="670" width="270" height="38" rx="6" fill="#E8F8F5"/>
  <text x="400" y="690" font-size="10" font-weight="600" fill="#48C9B0">回溯机制：</text>
  <text x="400" y="703" font-size="9" fill="#888">困惑检测 → 回退 → 降权重试</text>

  <!-- Core advantages -->
  <rect x="75" y="745" width="600" height="125" rx="12" fill="#ffffff" stroke="#E8E8EE" stroke-width="1"/>
  <text x="100" y="775" font-size="14" font-weight="700" fill="#333">核心优势</text>

  <rect x="95" y="793" width="175" height="30" rx="6" fill="#EFF3FF"/>
  <text x="182" y="813" text-anchor="middle" font-size="11" font-weight="600" fill="#667EEA">突破窗口限制</text>

  <rect x="285" y="793" width="175" height="30" rx="6" fill="#E8F8F5"/>
  <text x="372" y="813" text-anchor="middle" font-size="11" font-weight="600" fill="#48C9B0">上下文连续性</text>

  <rect x="475" y="793" width="180" height="30" rx="6" fill="#F5EEFA"/>
  <text x="565" y="813" text-anchor="middle" font-size="11" font-weight="600" fill="#AF7AC5">Token预算可控</text>

  <text x="105" y="848" font-size="11" fill="#777">将 200K 物理窗口变为近乎无限的有效工作记忆 → 支撑 1000 小时超长任务</text>

  <!-- Result at bottom-right -->
  <rect x="500" y="885" width="175" height="70" rx="14" fill="url(#gradResult)" filter="url(#shadow)"/>
  <text x="587" y="914" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">最终结论</text>
  <text x="587" y="936" text-anchor="middle" font-size="11" fill="#D0F0E8">置信度: 0.95+</text>

  <line x1="660" y1="430" x2="555" y2="885" stroke="#48C9B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowResult)" opacity="0.4"/>

</svg>
</div>
</body>
</html>
