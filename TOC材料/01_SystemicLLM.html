<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<title>Systemic LLM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
.fig{width:750px;height:1000px;background:#fff;position:relative;box-shadow:0 0 30px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div class="fig">
<svg width="750" height="1000" viewBox="0 0 750 1000" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="sd"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/></filter>
    <filter id="sd2"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000010"/></filter>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#3B7BC5"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#666"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#D06040"/></marker>
  </defs>

  <!-- Title block -->
  <rect x="30" y="20" width="690" height="54" rx="4" fill="#1a1a2e"/>
  <text x="375" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" letter-spacing="1">Systemic LLM — 体系化多模型推理网关架构</text>
  <text x="375" y="63" text-anchor="middle" font-size="9" fill="#889" letter-spacing="2">SYSTEMIC LLM GATEWAY ARCHITECTURE WITH COST-AWARE ROUTING</text>

  <!-- === LEFT PANEL (A): Provider Layer === -->
  <rect x="30" y="85" width="345" height="440" rx="4" fill="none" stroke="#ddd" stroke-width="1"/>
  <rect x="30" y="85" width="345" height="26" rx="4" fill="#f0f0f5"/>
  <rect x="30" y="105" width="345" height="6" fill="#f0f0f5"/>
  <text x="202" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#444">(A) LLM Provider Layer</text>

  <!-- OpenAI -->
  <rect x="42" y="122" width="320" height="72" rx="3" fill="#f8faff" stroke="#5B9BD5" stroke-width="1" filter="url(#sd2)"/>
  <rect x="42" y="122" width="4" height="72" rx="2" fill="#5B9BD5"/>
  <text x="58" y="142" font-size="12" font-weight="700" fill="#2c5f8a">OpenAI Provider</text>
  <text x="58" y="156" font-size="9" fill="#555">Endpoint: api.openai.com/v1  |  Key: OPENAI_API_KEY</text>
  <text x="58" y="170" font-size="9" fill="#555">Models: GPT-4o (128K ctx, $5/1M in), GPT-4o-mini ($0.15/1M)</text>
  <text x="58" y="184" font-size="8" fill="#888">Capabilities: Vision · Function Calling · Structured Output</text>

  <!-- Anthropic -->
  <rect x="42" y="200" width="320" height="72" rx="3" fill="#faf8ff" stroke="#7B68EE" stroke-width="1" filter="url(#sd2)"/>
  <rect x="42" y="200" width="4" height="72" rx="2" fill="#7B68EE"/>
  <text x="58" y="220" font-size="12" font-weight="700" fill="#4a3f9a">Anthropic Provider</text>
  <text x="58" y="234" font-size="9" fill="#555">Endpoint: api.anthropic.com  |  Key: ANTHROPIC_API_KEY</text>
  <text x="58" y="248" font-size="9" fill="#555">Models: Claude Sonnet 4 (200K ctx, $3/1M in), Opus 4</text>
  <text x="58" y="262" font-size="8" fill="#888">Capabilities: Extended Thinking · Computer Use · Caching</text>

  <!-- DeepSeek -->
  <rect x="42" y="278" width="320" height="72" rx="3" fill="#f8fffc" stroke="#20B2AA" stroke-width="1" filter="url(#sd2)"/>
  <rect x="42" y="278" width="4" height="72" rx="2" fill="#20B2AA"/>
  <text x="58" y="298" font-size="12" font-weight="700" fill="#1a7a74">DeepSeek Provider</text>
  <text x="58" y="312" font-size="9" fill="#555">Endpoint: api.deepseek.com/v1  |  Compatible: OpenAI SDK</text>
  <text x="58" y="326" font-size="9" fill="#555">Models: DeepSeek-V3 (64K ctx, $0.27/1M), R1 (Reasoning)</text>
  <text x="58" y="340" font-size="8" fill="#888">Capabilities: Deep Reasoning · Chain-of-Thought · Mamba</text>

  <!-- Local/Ollama -->
  <rect x="42" y="356" width="320" height="72" rx="3" fill="#fffcf8" stroke="#E8923A" stroke-width="1" filter="url(#sd2)"/>
  <rect x="42" y="356" width="4" height="72" rx="2" fill="#E8923A"/>
  <text x="58" y="376" font-size="12" font-weight="700" fill="#8a5a1a">Local / Ollama Provider</text>
  <text x="58" y="390" font-size="9" fill="#555">Endpoint: http://localhost:11434  |  Self-hosted</text>
  <text x="58" y="404" font-size="9" fill="#555">Models: Qwen2.5 (72B/32B), Llama 3, Mistral, Gemma</text>
  <text x="58" y="418" font-size="8" fill="#888">Capabilities: Fully offline · No API cost · Custom fine-tune</text>

  <!-- Plugin SDK -->
  <rect x="42" y="434" width="320" height="42" rx="3" fill="#f8f8fc" stroke="#5CB85C" stroke-width="1" stroke-dasharray="4,2" filter="url(#sd2)"/>
  <text x="58" y="454" font-size="10" font-weight="600" fill="#3a7a3a">Plugin SDK Extensible Provider</text>
  <text x="58" y="468" font-size="8" fill="#888">Custom Provider via Rust SDK / Python SDK · Dynamic loading</text>

  <!-- Right arrow from providers -->
  <line x1="375" y1="310" x2="405" y2="310" stroke="#3B7BC5" stroke-width="1.5" marker-end="url(#arrB)" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- === CENTER PANEL (B): Gateway Core === -->
  <rect x="390" y="85" width="330" height="440" rx="4" fill="none" stroke="#ddd" stroke-width="1"/>
  <rect x="390" y="85" width="330" height="26" rx="4" fill="#f0f0f5"/>
  <rect x="390" y="105" width="330" height="6" fill="#f0f0f5"/>
  <text x="555" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#444">(B) Systemic LLM Gateway Core</text>

  <!-- Gateway main block -->
  <rect x="405" y="118" width="300" height="395" rx="6" fill="#f5f7ff" stroke="#7B68EE" stroke-width="1.5" filter="url(#sd)"/>
  <text x="555" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#3a2f8a">Systemic LLM Router</text>
  <text x="555" y="156" text-anchor="middle" font-size="9" fill="#666">Unified Gateway · Plug &amp; Play Provider</text>

  <!-- Routing Strategy -->
  <rect x="415" y="168" width="280" height="52" rx="4" fill="#fff" stroke="#c5c0e8" stroke-width="1"/>
  <text x="425" y="186" font-size="10" font-weight="700" fill="#4a3f9a">Routing Strategy</text>
  <text x="425" y="200" font-size="8" fill="#666">cost_aware (default) | round_robin | least_latency</text>
  <text x="425" y="213" font-size="8" fill="#666">Fallback Chain: openai → anthropic → deepseek</text>

  <!-- Cost Budget -->
  <rect x="415" y="228" width="135" height="58" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="246" font-size="9" font-weight="700" fill="#444">Cost Budget Ctrl</text>
  <text x="425" y="260" font-size="8" fill="#666">daily_budget: $10.0</text>
  <text x="425" y="273" font-size="8" fill="#666">monthly: $300.0</text>

  <!-- Prompt Cache -->
  <rect x="560" y="228" width="135" height="58" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="570" y="246" font-size="9" font-weight="700" fill="#444">Prompt Cache</text>
  <text x="570" y="260" font-size="8" fill="#666">TTL: 3600s</text>
  <text x="570" y="273" font-size="8" fill="#666">Max: 10K entries</text>

  <!-- Request lifecycle flow -->
  <rect x="415" y="296" width="280" height="70" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="314" font-size="10" font-weight="700" fill="#444">Request Lifecycle</text>
  
  <!-- Flow boxes -->
  <rect x="418" y="324" width="50" height="18" rx="3" fill="#5B9BD5"/><text x="443" y="337" text-anchor="middle" font-size="7" fill="#fff">Parse</text>
  <text x="473" y="336" font-size="8" fill="#888">→</text>
  <rect x="480" y="324" width="50" height="18" rx="3" fill="#667EEA"/><text x="505" y="337" text-anchor="middle" font-size="7" fill="#fff">Route</text>
  <text x="535" y="336" font-size="8" fill="#888">→</text>
  <rect x="543" y="324" width="50" height="18" rx="3" fill="#7B68EE"/><text x="568" y="337" text-anchor="middle" font-size="7" fill="#fff">Exec</text>
  <text x="598" y="336" font-size="8" fill="#888">→</text>
  <rect x="606" y="324" width="50" height="18" rx="3" fill="#20B2AA"/><text x="631" y="337" text-anchor="middle" font-size="7" fill="#fff">Cache</text>

  <text x="425" y="358" font-size="7" fill="#888">Request → Parse intent → Select provider → Call LLM → Cache response</text>

  <!-- Algorithm details -->
  <rect x="415" y="376" width="280" height="68" rx="4" fill="#f8f8fc" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="394" font-size="9" font-weight="700" fill="#444">Fallback Algorithm</text>
  <text x="425" y="410" font-size="8" fill="#555">1. Try primary (cost_aware optimal)</text>
  <text x="425" y="423" font-size="8" fill="#555">2. On failure → chain fallback (≤2 retries)</text>
  <text x="425" y="436" font-size="8" fill="#555">3. All fail → Error + audit trail</text>

  <!-- Load balancing -->
  <rect x="415" y="454" width="280" height="48" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="472" font-size="9" font-weight="700" fill="#444">Load Balancer</text>
  <text x="425" y="486" font-size="8" fill="#555">Weighted round-robin · Provider health check · Circuit breaker</text>
  <text x="425" y="498" font-size="8" fill="#555">Latency tracking · Auto-disable unhealthy providers (>3 failures)</text>

  <!-- === BOTTOM: Performance Metrics & Summary === -->
  <rect x="30" y="540" width="690" height="180" rx="4" fill="none" stroke="#ddd" stroke-width="1"/>
  <rect x="30" y="540" width="690" height="26" rx="4" fill="#f0f0f5"/>
  <rect x="30" y="560" width="690" height="6" fill="#f0f0f5"/>
  <text x="375" y="557" text-anchor="middle" font-size="11" font-weight="700" fill="#444">(C) Routing Strategies — Formal Definitions</text>

  <!-- Strategy 1 -->
  <rect x="42" y="576" width="325" height="66" rx="4" fill="#f5faff" stroke="#c5d5f0" stroke-width="1"/>
  <text x="52" y="596" font-size="11" font-weight="700" fill="#2c5f8a">cost_aware · Cost-Optimal Routing</text>
  <text x="52" y="612" font-size="8" fill="#555">∀ request r, select provider p = argmin[Cost(p,r) × α + Latency(p,r) × β]</text>
  <text x="52" y="626" font-size="8" fill="#555">where α=0.7 (cost weight), β=0.3 (latency weight), subject to daily_budget</text>
  <text x="52" y="638" font-size="8" fill="#888">Typical savings: 40-60% vs single-provider (based on production telemetry)</text>

  <!-- Strategy 2 -->
  <rect x="383" y="576" width="325" height="66" rx="4" fill="#f5fffa" stroke="#c5e8d5" stroke-width="1"/>
  <text x="393" y="596" font-size="11" font-weight="700" fill="#1a7a74">adaptive_fallback · Failure-Resilient Chain</text>
  <text x="393" y="612" font-size="8" fill="#555">Chain: openai → anthropic → deepseek → local</text>
  <text x="393" y="626" font-size="8" fill="#555">On provider failure: backoff = min(2^n × 100ms, 5s), max 3 retries</text>
  <text x="393" y="638" font-size="8" fill="#888">Availability target: 99.9% effective uptime via chain fallback</text>

  <!-- Metrics summary -->
  <rect x="30" y="735" width="690" height="135" rx="4" fill="#fafaff" stroke="#e0e0ed" stroke-width="1"/>
  
  <text x="50" y="758" font-size="11" font-weight="700" fill="#333">Key Specifications</text>

  <rect x="42" y="772" width="108" height="42" rx="3" fill="#f0f2ff"/>
  <text x="96" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">~100ms</text>
  <text x="96" y="806" text-anchor="middle" font-size="8" fill="#666">P50 latency</text>

  <rect x="162" y="772" width="108" height="42" rx="3" fill="#f0f2ff"/>
  <text x="216" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">5+</text>
  <text x="216" y="806" text-anchor="middle" font-size="8" fill="#666">Provider types</text>

  <rect x="282" y="772" width="108" height="42" rx="3" fill="#f0f2ff"/>
  <text x="336" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">10K</text>
  <text x="336" y="806" text-anchor="middle" font-size="8" fill="#666">Cache entries</text>

  <rect x="402" y="772" width="108" height="42" rx="3" fill="#f0f2ff"/>
  <text x="456" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">3</text>
  <text x="456" y="806" text-anchor="middle" font-size="8" fill="#666">Fallback tiers</text>

  <rect x="522" y="772" width="108" height="42" rx="3" fill="#f0f2ff"/>
  <text x="576" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">99.9%</text>
  <text x="576" y="806" text-anchor="middle" font-size="8" fill="#666">Uptime SLA</text>

  <rect x="642" y="772" width="65" height="42" rx="3" fill="#f0f2ff"/>
  <text x="674" y="790" text-anchor="middle" font-size="10" font-weight="700" fill="#667EEA">200K</text>
  <text x="674" y="806" text-anchor="middle" font-size="8" fill="#666">Max ctx</text>

  <text x="50" y="842" font-size="9" fill="#777">Design: Unified API (OpenAI-compatible) · Plugin SDK (Rust/Python) · Hot-swap providers · Zero-downtime fallback · Cost-optimized routing</text>
  <text x="50" y="858" font-size="8" fill="#888">Reference: AgentOS Systemic LLM Gateway v0.1.1 · Architecture Doc: Docs/Capital_Architecture/llm_d.md</text>

  <!-- Labels -->
  <text x="375" y="970" text-anchor="middle" font-size="8" fill="#999">Systemic LLM · AgentOS Core Architecture · Investor Presentation · June 2026</text>

</svg>
</div>
